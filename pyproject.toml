[project]
name = "examsim"
version = "0.1.0"
description = "Timed multiple-choice exam simulation built with Django"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3",
  "python-docx>=1.1,<2",
  "PyMuPDF>=1.24,<2",
]

[dependency-groups]
dev = [
  "coverage>=7.6,<8",
  "factory-boy>=3.3,<4",
  "pytest>=8.3,<10",
  "pytest-django>=4.9,<5",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
exclude = [".venv", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
